{% load printing %}{% print_locations as pc_locations %}
<div class="print-control form-inline" data-kind="{{ kind }}" data-id="{{ object_id }}" data-url="/onsite/{{ program.getUrlBase }}/printers_queue">
  {% csrf_token %}
  <label>Print to
    <select class="print-control-location input-medium">
      {% for l in pc_locations %}<option value="{% if not l.is_default %}{{ l.id }}{% endif %}">{{ l.name }}{% if l.is_default %} (default){% endif %}</option>{% endfor %}
    </select></label>
  <button type="button" class="btn btn-small print-control-button"><span class="glyphicon glyphicon-print" aria-hidden="true"></span> {{ label|default:"Print" }}</button>
  <span class="print-control-message"></span>
</div>
<script type="text/javascript">
(function ($j) {
    var KEY = 'esp_print_location';
    function say(msg, cls, text) {
        msg.removeClass('text-success text-error muted').addClass(cls).text(text);
    }
    $j(function () {
        $j('.print-control').each(function () {
            var box = $j(this), select = box.find('select');
            try {
                var saved = window.localStorage.getItem(KEY);
                if (saved !== null && select.find('option').filter(function () { return this.value === saved; }).length) {
                    select.val(saved);
                }
            } catch (e) {}
            select.on('change', function () {
                try { window.localStorage.setItem(KEY, select.val()); } catch (e) {}
            });
            box.find('.print-control-button').on('click', function () {
                var btn = $j(this), msg = box.find('.print-control-message');
                var data = {kind: box.data('kind'), location: select.val()};
                data[box.data('kind') === 'receipt' ? 'receipt' : 'user'] = box.data('id');
                btn.prop('disabled', true);
                say(msg, 'muted', 'Sending...');
                $j.ajax({
                    url: box.data('url'), type: 'POST', data: data,
                    headers: {'X-CSRFToken': box.find('input[name=csrfmiddlewaretoken]').val()}
                }).done(function (r) {
                    say(msg, 'text-success', r.message);
                }).fail(function (xhr) {
                    var r = xhr.responseJSON || {};
                    say(msg, 'text-error', r.error || 'Could not queue it. Try again.');
                }).always(function () { btn.prop('disabled', false); });
            });
        });
    });
})(window.$j || window.jQuery);
</script>
