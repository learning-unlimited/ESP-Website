{# TODO(benkraft): This isn't that different from the non-theme one, dedupe #}
<div id="loginbox">

  <div class="logged_in">
    <form class="navbar-form form-inline">
      <a href="{% url 'myesp_profile' %}" class="username">
        <i class="bi bi-person"></i> Hello, <span id="user_first_name"></span>!
      </a>

      <a class="btn" href="{% url 'signout' %}">Logout</a>

      <span class="dropdown">
        <button type="button" class="btn dropdown-toggle" data-bs-toggle="dropdown" style="margin-left:0px;">
          &#9662;
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
          <li><a href="{% url 'myesp_accountmanage' %}">Manage Account</a></li>
          <li><a href="/myesp/loginhelp.html">Help</a></li>
          <li><a href="https://www.learningu.org/about/privacy/" target="_blank">Privacy Policy</a></li>
        </ul>
      </span>
    </form>
  </div>

  <div class="not_logged_in">
    <form name="loginform" id="loginform" method="post" action="/myesp/login/" class="navbar-form form-inline">
      <input type="hidden" name="next" value="{{ request.path }}" />
      <input type="text" name="username" required id="user" size="8" value="" placeholder="Username" maxlength="255" class="inputbox" />
      <input type="password" name="password" required id="pass" size="8" value="" placeholder="Password" maxlength="255" class="inputbox" />

      <button class="btn" id="gologin" type="submit">Login</button>
      <span class="dropdown">
        <button type="button" class="btn dropdown-toggle" data-bs-toggle="dropdown" style="margin-left:0px;">
          &#9662;
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a href="/myesp/register">Register</a></li>
          <li><a href="/myesp/passwdrecover/">Forgot Password</a></li>
          <li><a href="/myesp/loginhelp.html">Help</a></li>
          <li><a href="https://www.learningu.org/about/privacy/" target="_blank">Privacy Policy</a></li>
        </ul>
      </span>

    </form>
  </div>
</div>

<script type="text/javascript">
  /* Fill the greeting name during parsing (before first paint) to avoid a
     flash of empty text. */
  (function () {
    try {
      if (!window.esp_user) { return; }
      var el = document.getElementById("user_first_name");
      if (el) {
        var n = ("" + (esp_user.cur_first_name || esp_user.cur_username || "Guest")).trim();
        if (n && n !== "undefined") { el.textContent = n; }
      }
    } catch (e) {}
  })();
</script>
