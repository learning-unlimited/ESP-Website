codecov:
  notify:
    # tests.yml runs the suite as parallel shards, each uploading the partial
    # report for the tests it ran. Without this, Codecov would evaluate the
    # project status against whichever shard landed first -- a fraction of the
    # lines -- and fail it. Keep in sync with TEST_SPLITS and the `shard`
    # matrix in .github/workflows/tests.yml.
    after_n_builds: 4

coverage:
  status:
    project:
      default:
        # Overall coverage must stay at or above this level.
        target: 75%
        # Tolerance for run-to-run noise; a larger drop is a real regression.
        threshold: 0.1%
    # Explicitly off: omitting this key would enable the patch status with a
    # target of auto, rather than disabling it.
    patch: no

comment: false
