coverage:
  status:
    project:
      default:
        # Overall coverage must stay at or above this level.
        target: 70%
        # Tolerance for run-to-run noise; a larger drop is a real regression.
        threshold: 0.1%
    patch:
      default:
        # New and changed lines in a pull request must be at least this covered.
        target: 60%

comment: false
