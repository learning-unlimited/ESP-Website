name: Issue Triage Gate

on:
  issues:
    types: [opened, unlabeled]

jobs:
  # When a new issue is opened, lock it and label it for triage
  # unless the author has triage-level permissions or higher.
  lock-new-issue:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check author permissions
        id: check-perms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.issue.user.login }}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          echo "permission=$PERM" >> "$GITHUB_OUTPUT"

          # triage, write, maintain, admin → skip the lock
          case "$PERM" in
            admin|maintain|write|triage) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)                           echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Add needs-triage label
        if: steps.check-perms.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "needs-triage"

      - name: Check if first-time contributor
        id: first-time
        if: steps.check-perms.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Query the number of issues created by the author in this repo
          PREV_ISSUES=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $author: String!) {
              repository(owner: $owner, name: $repo) {
                issues(filterBy: {createdBy: $author}, first: 2) {
                  totalCount
                }
              }
            }' -F owner="${{ github.repository_owner }}" -F repo="${{ github.event.repository.name }}" -F author="${{ github.event.issue.user.login }}" --jq '.data.repository.issues.totalCount' 2>/dev/null || echo "2")
          
          # If totalCount is exactly 1 (the one they just opened), it is their first issue
          if [ "$PREV_ISSUES" -eq 1 ]; then
            echo "is_first=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_first=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post unified triage notice (First-time)
        if: steps.check-perms.outputs.skip == 'false' && steps.first-time.outputs.is_first == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "👋 Thanks for opening your first issue here! We appreciate you taking the time to report this.

          To keep the tracker focused, new issues are **locked for conversation** until a maintainer has reviewed them. This helps us avoid duplicates and ensure issues are actionable.

          **What happens next:**
          - A maintainer will review this issue shortly and may ask follow-up questions.
          - If approved, the conversation will be unlocked and the \`needs-triage\` label removed.
          - Please check the [existing issues](https://github.com/learning-unlimited/ESP-Website/issues) to see if this has been reported before.
          - For setup help, see our [documentation](https://github.com/learning-unlimited/ESP-Website/tree/main/docs).

          Please don't worry — your issue hasn't been rejected, it's just waiting for review. 🙏"

      - name: Post triage notice (Repeat contributor)
        if: steps.check-perms.outputs.skip == 'false' && steps.first-time.outputs.is_first == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "👋 Thanks for opening this issue!

          To keep the tracker focused, new issues are **locked for conversation** until a maintainer has reviewed them. This helps us avoid duplicates and ensure issues are actionable.

          **What happens next:**
          - A maintainer will review this issue shortly.
          - If approved, the conversation will be unlocked and the \`needs-triage\` label removed.
          - If this is a duplicate or out of scope, a maintainer will close it with an explanation.

          Please don't worry — your issue hasn't been rejected, it's just waiting for review. 🙏"


      - name: Lock conversation
        if: steps.check-perms.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/lock" \
            -f lock_reason="resolved"

  # When a maintainer removes the needs-triage label, unlock the issue.
  unlock-triaged-issue:
    if: >-
      github.event.action == 'unlabeled'
      && github.event.label.name == 'needs-triage'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Unlock conversation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/lock"
