name: Issue Triage Gate

on:
  issues:
    types: [opened, unlabeled]

jobs:
  # When a new issue is opened, lock it and label it for triage
  # unless the author has triage-level permissions or higher.
  lock-new-issue:
    if: github.event.action == 'opened'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Check author permissions
        id: check-perms
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PERM=$(gh api "repos/${{ github.repository }}/collaborators/${{ github.event.issue.user.login }}/permission" \
            --jq '.permission' 2>/dev/null || echo "none")
          echo "permission=$PERM" >> "$GITHUB_OUTPUT"

          # triage, write, maintain, admin → skip the lock
          case "$PERM" in
            admin|maintain|write|triage) echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            *)                           echo "skip=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Add needs-triage label
        if: steps.check-perms.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --add-label "needs-triage"

      - name: Check if first-time issue author
        id: first-time
        if: steps.check-perms.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # First issue if the author's earliest issue (PRs excluded) is this one, or none is indexed yet
          if EARLIEST=$(gh api graphql -f query='
            query($owner: String!, $repo: String!, $author: String!) {
              repository(owner: $owner, name: $repo) {
                issues(first: 1, orderBy: {field: CREATED_AT, direction: ASC}, filterBy: {createdBy: $author}) {
                  nodes { number }
                }
              }
            }' -F owner="$OWNER" -F repo="$REPO_NAME" -F author="$AUTHOR" \
            --jq '.data.repository.issues.nodes[0].number // empty'); then
            if [ -z "$EARLIEST" ] || [ "$EARLIEST" = "$ISSUE_NUMBER" ]; then
              echo "is_first=true" >> "$GITHUB_OUTPUT"
            else
              echo "is_first=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # On API failure, fall back to the standard notice rather than failing the job
            echo "::warning::Could not determine whether this is the author's first issue"
            echo "is_first=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post triage notice
        if: steps.check-perms.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          IS_FIRST: ${{ steps.first-time.outputs.is_first }}
        run: |
          # First-time authors get the welcome folded into this notice, since the issue is locked right after
          if [ "$IS_FIRST" = "true" ]; then
            GREETING="👋 Thanks for opening your first issue here! We appreciate you taking the time to report this."
            EXTRA="
          - Please check the [existing issues](https://github.com/$REPO/issues) to see if this has been reported before.
          - For setup help, see our [documentation](https://github.com/$REPO/tree/main/docs)."
          else
            GREETING="👋 Thanks for opening this issue!"
            EXTRA=""
          fi

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --body "$GREETING

          To keep the tracker focused, new issues are **locked for conversation** until a maintainer has reviewed them. This helps us avoid duplicates and ensure issues are actionable.

          **What happens next:**
          - A maintainer will review this issue shortly and may ask follow-up questions.
          - If approved, the conversation will be unlocked and the \`needs-triage\` label removed.
          - If this is a duplicate or out of scope, a maintainer will close it with an explanation.$EXTRA

          Please don't worry — your issue hasn't been rejected, it's just waiting for review. 🙏"

      - name: Lock conversation
        if: steps.check-perms.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PUT \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/lock" \
            -f lock_reason="resolved"

  # When a maintainer removes the needs-triage label, unlock the issue.
  unlock-triaged-issue:
    if: >-
      github.event.action == 'unlabeled'
      && github.event.label.name == 'needs-triage'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - name: Unlock conversation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method DELETE \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/lock"
